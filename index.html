<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col">
          <div class="mb-3 mt-4">
            <label class="form-label">Jam</label>
            <input type="number" class="form-control" id="jam" placeholder="" />
          </div>
          <div class="mb-3 mt-4">
            <label class="form-label">Menit</label>
            <input
              type="number"
              class="form-control"
              id="menit"
              placeholder=""
            />
          </div>
          <div class="mb-3 mt-4">
            <label class="form-label">Makan</label>
            <input
              type="number"
              class="form-control"
              id="makan"
              placeholder=""
            />
          </div>
        </div>
        <div class="col">
          <div class="mb-3 mt-4">
            <label class="form-label">Terlambat</label>
            <input
              type="number"
              class="form-control"
              id="terlambat"
              placeholder=""
            />
          </div>
          <div class="mb-3 mt-4">
            <label class="form-label">Jam lembur</label>
            <input
              type="number"
              class="form-control"
              id="jamLembur"
              placeholder=""
            />
          </div>
        </div>
      </div>

      <h5 id="hasil" class="text-center mt-4"></h5>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
